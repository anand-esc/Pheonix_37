name: Phoenix CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-glx  # Often required by OpenCV/Ultralytics (YOLO)

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev]

    - name: Check formatting with Black
      run: |
        black --check .
      continue-on-error: true # Don't block the build on formatting yet

    - name: Run linting with Ruff
      run: |
        ruff check .
      continue-on-error: true # Don't block the build on linting yet

    - name: Run pytest test suite
      run: |
        pytest tests/ -v
      env:
        # Pass a test secret for the ledger RBAC tests
        PHOENIX_LEDGER_SECRET: "ci-automated-test-secret-123"
