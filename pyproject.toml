[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phoenix"
version = "0.1.0"
description = "Phoenix - Vendor-agnostic forensic pipeline for surveillance footage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
    "reportlab>=4.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
# AI triage (backend/ai) is optional: the pipeline skips it when these are absent.
ai = [
    "torch>=2.0",
    "ultralytics>=8.0",
    "Pillow>=10.0",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "httpx>=0.24.0",  # fastapi.testclient needs it; API route tests skip without it
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
target-version = ['py311']
